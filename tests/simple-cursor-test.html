<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Cursor Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: white;
            cursor: crosshair;
        }
        
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0,0,0,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.1) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        .cursor {
            position: absolute;
            pointer-events: none;
            z-index: 1000;
            transition: all 0.05s ease-out;
        }
        
        .status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 12px;
        }
        
        .instructions {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            font-size: 12px;
            max-width: 300px;
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <div class="grid"></div>
    </div>
    
    <div class="status" id="status">
        Status: Connecting...<br>
        Server: ws://localhost:8081<br>
        Users: 0
    </div>
    
    <div class="instructions">
        <strong>Multi-User Cursor Test</strong><br><br>
        1. Open this page in multiple browser windows<br>
        2. Move your mouse around<br>
        3. See other users' cursors in real-time!<br><br>
        <span id="userInfo">User: Not connected</span>
    </div>

    <script>
        class CursorSync {
            constructor() {
                this.ws = null;
                this.userId = null;
                this.cursors = new Map();
                this.container = document.getElementById('container');
                this.statusEl = document.getElementById('status');
                this.userInfoEl = document.getElementById('userInfo');
                
                this.connect();
                this.setupMouseTracking();
            }
            
            connect() {
                console.log('Connecting to ws://localhost:8081...');
                
                try {
                    this.ws = new WebSocket('ws://localhost:8081');
                    
                    this.ws.onopen = () => {
                        console.log('✅ Connected!');
                        this.updateStatus('Connected', 'green');
                        
                        // Join default room
                        this.send({
                            type: 'JOIN_ROOM',
                            roomId: 'demo-room'
                        });
                    };
                    
                    this.ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        this.handleMessage(data);
                    };
                    
                    this.ws.onclose = () => {
                        console.log('❌ Disconnected');
                        this.updateStatus('Disconnected', 'red');
                        
                        // Reconnect after 3 seconds
                        setTimeout(() => this.connect(), 3000);
                    };
                    
                    this.ws.onerror = (error) => {
                        console.error('WebSocket error:', error);
                        this.updateStatus('Error', 'red');
                    };
                    
                } catch (error) {
                    console.error('Connection failed:', error);
                    this.updateStatus('Failed to connect', 'red');
                    setTimeout(() => this.connect(), 5000);
                }
            }
            
            send(data) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(data));
                }
            }
            
            handleMessage(data) {
                console.log('Received:', data);
                
                switch (data.type) {
                    case 'USER_INIT':
                        this.userId = data.userId;
                        this.userInfoEl.textContent = `User: ${data.userId.replace('user_', '')}`;
                        break;
                        
                    case 'CURSOR_UPDATE':
                        if (data.userId !== this.userId) {
                            this.updateCursor(data.userId, data.x, data.y, data.color);
                        }
                        break;
                        
                    case 'USER_LEFT':
                        this.removeCursor(data.userId);
                        break;
                        
                    case 'ROOM_STATE':
                        // Load existing cursors
                        Object.entries(data.cursors || {}).forEach(([userId, cursor]) => {
                            if (userId !== this.userId) {
                                const user = data.users?.find(u => u.userId === userId);
                                this.updateCursor(userId, cursor.x, cursor.y, user?.color || '#999');
                            }
                        });
                        break;
                }
                
                this.updateUserCount();
            }
            
            updateCursor(userId, x, y, color) {
                let cursor = this.cursors.get(userId);
                
                if (!cursor) {
                    cursor = this.createCursorElement(userId, color);
                    this.cursors.set(userId, cursor);
                    this.container.appendChild(cursor);
                }
                
                cursor.style.left = `${x}px`;
                cursor.style.top = `${y}px`;
                cursor.style.display = (x < 0 || y < 0) ? 'none' : 'block';
            }
            
            removeCursor(userId) {
                const cursor = this.cursors.get(userId);
                if (cursor) {
                    cursor.remove();
                    this.cursors.delete(userId);
                }
            }
            
            createCursorElement(userId, color) {
                const cursor = document.createElement('div');
                cursor.className = 'cursor';
                cursor.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 20 20">
                        <path d="M2 2l12 7-4 0-2 5z" fill="${color}" stroke="white" stroke-width="1"/>
                    </svg>
                    <div style="
                        position: absolute;
                        top: 18px;
                        left: 15px;
                        background: ${color};
                        color: white;
                        padding: 2px 5px;
                        border-radius: 3px;
                        font-size: 10px;
                        white-space: nowrap;
                    ">${userId.replace('user_', '')}</div>
                `;
                return cursor;
            }
            
            setupMouseTracking() {
                let lastSent = 0;
                
                this.container.addEventListener('mousemove', (event) => {
                    const now = Date.now();
                    if (now - lastSent < 50) return; // Throttle to 20 FPS
                    
                    const rect = this.container.getBoundingClientRect();
                    const x = event.clientX - rect.left;
                    const y = event.clientY - rect.top;
                    
                    this.send({
                        type: 'CURSOR_MOVE',
                        x: x,
                        y: y
                    });
                    
                    lastSent = now;
                });
                
                this.container.addEventListener('mouseleave', () => {
                    this.send({
                        type: 'CURSOR_MOVE',
                        x: -1,
                        y: -1
                    });
                });
            }
            
            updateStatus(status, color) {
                this.statusEl.style.borderLeft = `4px solid ${color}`;
                this.statusEl.innerHTML = `
                    Status: ${status}<br>
                    Server: ws://localhost:8081<br>
                    Users: ${this.cursors.size}
                `;
            }
            
            updateUserCount() {
                const currentStatus = this.statusEl.innerHTML;
                this.statusEl.innerHTML = currentStatus.replace(
                    /Users: \d+/,
                    `Users: ${this.cursors.size}`
                );
            }
        }
        
        // Start when page loads
        window.addEventListener('load', () => {
            new CursorSync();
        });
    </script>
</body>
</html>
